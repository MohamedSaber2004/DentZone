<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/denta-logo.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/denta-logo.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/denta-logo.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/denta-logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/denta-logo.png">
    <link rel="shortcut icon" href="/denta-logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DentZone — dental supplies for clinics and practices: tools, equipment and consumables from trusted suppliers, delivered to your practice.">
    <title>DentZone — Dental supplies & equipment for clinics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('dentzone-theme')
          if (
            t === 'dark' ||
            (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.dataset.theme = 'dark'
          }
          var l = localStorage.getItem('dentzone-locale') || 'ar'
          document.documentElement.lang = l
          document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'
        } catch (e) {}
      })()
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Spline+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    >
  </head>
  <body>
    <div id="app">
      <div id="initial-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d1821;color:#ffffff;font-family:'Spline Sans',system-ui,-apple-system,sans-serif;z-index:99999;">
        <div style="position:relative;display:flex;align-items:center;justify-content:center;width:160px;height:160px;margin-bottom:1.4rem;">
          <div style="position:absolute;inset:-8px;border-radius:50%;border:2.5px dashed #d4a24c;opacity:0.8;animation:splash-spin 3.5s linear infinite;"></div>
          <img src="/denta-logo.png" alt="DentZone" style="width:130px;height:130px;object-fit:contain;border-radius:24px;box-shadow:0 14px 36px rgba(0,0,0,0.5);animation:splash-breathe 2.2s ease-in-out infinite;" />
        </div>
        <div style="font-size:2rem;font-weight:700;letter-spacing:-0.02em;color:#ffffff;display:flex;align-items:center;gap:3px;">
          Dent<span style="color:#d4a24c;">Zone</span>
        </div>
      </div>
      <style>
        @keyframes splash-spin { to { transform: rotate(360deg); } }
        @keyframes splash-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      </style>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
